<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINI &amp; MANY — Company Profile</title>
  <meta name="description" content="MINI &amp; MANY company profile — a gallery of flavors designed to be shared. Kuwait.">
  <meta property="og:title" content="MINI &amp; MANY — Company Profile">
  <meta property="og:description" content="A gallery of flavors designed to be shared.">
  <meta property="og:image" content="cover.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1C362B;
      --gold: #CFA08A;
      --cream: #F6EFE2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--green);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrap {
      width: min(420px, calc(100% - 36px));
      margin: 18px auto;
      padding: 28px 22px 20px;
      text-align: center;
      border: 1px solid var(--gold);
      outline: 1px solid rgba(207, 160, 138, 0.55);
      outline-offset: 7px;
    }
    .logo {
      width: 180px;
      max-width: 62%;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }
    .rule {
      width: 72px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 14px;
      border: 0;
    }
    h1 {
      margin: 0 0 8px;
      color: var(--gold);
      font-weight: 500;
      font-size: 1.28rem;
      letter-spacing: 0.16em;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .tagline {
      margin: 0 0 16px;
      font-style: italic;
      font-size: 1.12rem;
      line-height: 1.45;
      color: var(--green);
      opacity: 0.92;
    }
    .cover-link {
      display: block;
      margin: 0 auto 16px;
      line-height: 0;
    }
    .cover {
      width: 100%;
      height: auto;
      max-height: 34vh;
      object-fit: cover;
      object-position: center top;
      border: 1px solid var(--gold);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      text-decoration: none;
      font-family: inherit;
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--green);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      color: var(--green);
      border: 1px solid var(--gold);
    }
    .btn-secondary:hover { background: rgba(207, 160, 138, 0.16); }
    footer {
      margin: 16px 0 0;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--green);
      opacity: 0.75;
    }
    footer a {
      color: inherit;
      text-decoration: none;
    }
    footer a:hover { color: var(--gold); }
    @media (max-height: 720px) {
      .wrap { padding: 28px 22px 22px; margin: 16px auto; }
      .cover { max-height: 30vh; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="MINI &amp; MANY">
    <hr class="rule">
    <h1>Company Profile</h1>
    <p class="tagline">A gallery of flavors designed to be shared.</p>
    <a class="cover-link" href="profile.pdf" target="_blank" rel="noopener">
      <img class="cover" src="cover.jpg" alt="MINI &amp; MANY company profile cover">
    </a>
    <div class="actions">
      <a class="btn btn-primary" href="profile.pdf" target="_blank" rel="noopener">View Company Profile</a>
      <a class="btn btn-secondary" href="profile.pdf" download="MINI-AND-MANY-Company-Profile.pdf">Download</a>
    </div>
    <footer>
      <a href="https://miniandmany.com" target="_blank" rel="noopener">miniandmany.com</a>
      &nbsp;·&nbsp; Kuwait
    </footer>
  </main>
</body>
</html>
